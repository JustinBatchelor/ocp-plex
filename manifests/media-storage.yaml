apiVersion: v1
kind: PersistentVolume
metadata:
  name: plex-media
  labels:
    app.kubernetes.io/name: plex
    app.kubernetes.io/component: media
spec:
  capacity:
    storage: 50Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: plex-media-static
  mountOptions:
    - nfsvers=4.1
    - hard
    - timeo=600
    - retrans=2
  nfs:
    server: truenas.batchelor.live
    path: /mnt/main/plex
    readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-media
  namespace: plex
  labels:
    app.kubernetes.io/name: plex
    app.kubernetes.io/component: media
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 50Ti
  storageClassName: plex-media-static
  volumeName: plex-media

