apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: plex-use-anyuid-scc
  namespace: plex
  labels:
    app.kubernetes.io/name: plex
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: plex
    namespace: plex

