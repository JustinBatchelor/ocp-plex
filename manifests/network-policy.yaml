apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: plex-ingress
  namespace: plex
  labels:
    app.kubernetes.io/name: plex
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: plex-media-server
      app.kubernetes.io/instance: plex
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
      ports:
        - protocol: TCP
          port: 32400

