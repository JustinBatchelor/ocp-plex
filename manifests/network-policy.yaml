apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: plex-ingress
  namespace: plex
  labels:
    app.kubernetes.io/name: plex
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: plex-media-server
      app.kubernetes.io/instance: plex
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              # Includes OpenShift's host-network ingress identity, required
              # when the router and Plex run on different nodes.
              policy-group.network.openshift.io/ingress: ""
      ports:
        - protocol: TCP
          port: 32400
