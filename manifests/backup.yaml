apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-config-backup
  namespace: plex
  labels:
    app.kubernetes.io/name: plex
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: truenas-nfs
  resources:
    requests:
      storage: 100Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: plex-config-backup-template
  namespace: plex
  labels:
    app.kubernetes.io/name: plex
    app.kubernetes.io/component: backup
spec:
  # This is a reusable template, not a scheduled job. Backups are started by
  # scripts/backup-config.sh so Plex is quiesced before its files are copied.
  schedule: "0 0 31 2 *"
  suspend: true
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: plex-config-backup
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: registry.access.redhat.com/ubi9/ubi:9.6
              command:
                - /bin/sh
                - -ec
                - |
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  archive="/backup/plex-config-${stamp}.tar.gz"
                  tar -C /config -czf "$archive" .
                  sha256sum "$archive" > "${archive}.sha256"
                  find /backup -maxdepth 1 -type f -name 'plex-config-*.tar.gz' -mtime +7 -delete
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: backup
                  mountPath: /backup
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: pms-config-plex-0
            - name: backup
              persistentVolumeClaim:
                claimName: plex-config-backup
